<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>search-result</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- Наш CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4 text-center">Search result</h1>

    <div class="row g-4">
        {% for v in vacancies %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ v.title }}</h5>
                    <p class="card-text"><strong>Company:</strong> {{ v.employer }}</p>
                    <p class="card-text"><strong>Location:</strong> {{ v.location }}</p>
                    <p class="card-text"><strong>Salary:</strong> {{ v.salary }}</p>
                    <a href="{{ v.link }}" target="_blank" class="btn btn-primary mt-2">Link</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="mt-4 text-center">
        <a href="{{ url_for('main') }}" class="btn btn-secondary">Back to search</a>
    </div>
</div>

</body>
</html>
