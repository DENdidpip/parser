<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Email Verification</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>

    <!-- HEADER -->
    <header class="p-3 text-bg-dark custom-header">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between">
                <a href="{{ url_for('main.main') }}" class="text-white text-decoration-none logo-text">
                    Parser
                </a>

                <div class="text-end">
                    <a href="{{ url_for('main.main') }}" class="btn btn-outline-light">Home</a>
                </div>
            </div>
        </div>
    </header>

    <!-- VERIFY CARD -->
    <div class="auth-page">
        <div class="auth-card">
            <h2 class="auth-title">Verify your email</h2>
            <p class="auth-subtitle">
                We sent a verification code to
            </p>

            <div class="verify-email-box">
                {{ email }}
            </div>

            <form method="post" class="auth-form mt-4">
                <div class="mb-4">
                    <label class="form-label">Verification code</label>
                    <input type="text" class="form-control auth-input text-center verify-code-input"
                        name="code" placeholder="Enter 6-digit code" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 auth-submit-btn">
                    Verify account
                </button>
            </form>

            <div class="auth-footer">
                <p class="mb-0">
                    Didn’t receive the code?
                    <a href="{{ url_for('main.sign_up') }}" class="auth-link">Try again</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
