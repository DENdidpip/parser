<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>

    <!-- HEADER -->
    <header class="p-3 text-bg-dark custom-header">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between">
                <a href="{{ url_for('main.main') }}" class="text-white text-decoration-none logo-text">
                    Parser
                </a>

                <div class="text-end">
                    <a href="{{ url_for('main.main') }}" class="btn btn-outline-light">Home</a>
                </div>
            </div>
        </div>
    </header>


    <!-- SIGN UP CARD -->
    <div class="auth-page">
        <div class="auth-card">
            <h2 class="auth-title">Create account</h2>
            <p class="auth-subtitle">Register to continue using Parser</p>

            <form method="post" class="auth-form">
                <div class="mb-3">
                    <label class="form-label">Nickname</label>
                    <input type="text" class="form-control auth-input" placeholder="Enter your nickname" name="nick" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control auth-input" placeholder="Enter your email" name="email" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control auth-input" placeholder="Create a password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 auth-submit-btn">Sign up</button>
            </form>

            <div class="auth-footer">
                <p class="mb-0">
                    Already have an account?
                    <a href="{{ url_for('main.login') }}" class="auth-link">Log in</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
